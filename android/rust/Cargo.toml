# Android JNI shim over the y-crdt `yrs` Rust core (yrs 0.25.x) — the Android
# sibling of this repo's Apple xcframework. Compiles to a per-ABI
# `libyrs_android.so` exposing a JNI surface to Kotlin.
#
# It binds `yrs` directly (rather than re-binding yffi's C ABI from Rust) because
# JNI <-> Rust <-> yrs is one fewer FFI hop than JNI -> C ABI -> yrs, which
# removes a class of pointer/ownership bugs at the boundary. The Kotlin-facing
# method names mirror the C ABI (ydoc_new, ytext_insert, state-vector /
# state-diff / apply) so downstream Kotlin wrappers stay symmetric with the
# Apple side.
[package]
name = "yrs_android"
version = "0.25.0"
edition = "2021"
publish = false

[lib]
name = "yrs_android"
# cdylib -> the .so that the JVM dlopen()s via System.loadLibrary("yrs_android").
crate-type = ["cdylib"]

[dependencies]
# Same Rust CRDT core as iOS (YrsFFI pins yffi/yrs 0.25.x).
yrs = "=0.25.0"
# JNI bindings. 0.21 is the current stable line and supports the NDK toolchain.
jni = "0.21.1"

[profile.release]
# Small, fast .so files for the bundled AAR.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
